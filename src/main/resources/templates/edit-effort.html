<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Effort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">

    <h2 class="text-center mb-4">Edit Effort</h2>

    <form th:action="@{/efforts/update}" method="post">

        <input type="hidden" name="id" th:value="${effort.id}"/>

        <div class="mb-3">
            <label>Task Name</label>
            <input type="text" name="taskName" class="form-control"
                   th:value="${effort.taskName}" required>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <input type="text" name="description" class="form-control"
                   th:value="${effort.description}">
        </div>

        <div class="mb-3">
            <label>Minutes</label>
            <input type="number" step="0.5" name="minutes"
                   class="form-control"
                   th:value="${effort.minutes}" required>
        </div>

        <div class="mb-3">
            <label>Hours</label>
            <input type="number" step="0.5" name="hours"
                   class="form-control"
                   th:value="${effort.hours}" required>
        </div>

        <!--<div class="mb-3">
            <label>Date</label>
            <input type="date"
                   id="effortDate"
                   name="date"
                   class="form-control"
                   th:value="${effort.date}"
                   required>
        </div>-->

        <button class="btn btn-primary w-100">Update</button>

    </form>

</div>
<script>
    let today = new Date();
    let yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    let dateInput = document.getElementById("effortDate");

    dateInput.min = yesterday.toISOString().split("T")[0];
    dateInput.max = today.toISOString().split("T")[0];
</script>
</body>
</html>
