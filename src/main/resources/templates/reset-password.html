<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            min-height: 100vh;
        }

        .card-style {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .card-header {
            font-weight: bold;
            font-size: 20px;
            background-color: #343a40 !important;
            color: white;
            border-radius: 12px 12px 0 0;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-primary {
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/index}">
            Employee Efforts Tracker
        </a>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="col-md-4">

        <div class="card card-style">
            <div class="card-header text-center">
                Reset Password
            </div>

            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger text-center">
                    <span th:text="${error}"></span>
                </div>

                <form th:action="@{/reset-password}" method="post" onsubmit="return validatePassword()">

                    <input type="hidden" name="email" th:value="${email}" />

                    <div class="mb-3">
                        <label>New Password</label>
                        <input type="password" id="password" name="password" class="form-control" required onkeyup="checkStrength()">

                        <!-- Strength Meter -->
                        <small id="strengthText" class="form-text"></small>
                    </div>

                    <div class="mb-3">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required onkeyup="checkMatch()">

                        <!-- Match Status -->
                        <small id="matchText"></small>
                    </div>

                    <div id="errorMsg" class="text-danger text-center mb-2"></div>

                    <button type="submit" class="btn btn-primary">
                        Update Password
                    </button>
                </form>

                <script>
                    function checkStrength() {
                        let password = document.getElementById("password").value;
                        let strengthText = document.getElementById("strengthText");

                        let strength = 0;

                        if (password.length >= 6) strength++;
                        if (password.match(/[A-Z]/)) strength++;
                        if (password.match(/[0-9]/)) strength++;
                        if (password.match(/[@$!%*?&]/)) strength++;

                        if (password.length === 0) {
                            strengthText.innerText = "";
                        } else if (strength <= 1) {
                            strengthText.innerText = "Weak password";
                            strengthText.style.color = "red";
                        } else if (strength === 2 || strength === 3) {
                            strengthText.innerText = "Medium strength";
                            strengthText.style.color = "orange";
                        } else {
                            strengthText.innerText = "Strong password";
                            strengthText.style.color = "green";
                        }
                    }

                    function checkMatch() {
                        let password = document.getElementById("password").value;
                        let confirm = document.getElementById("confirmPassword").value;
                        let matchText = document.getElementById("matchText");

                        if (confirm.length === 0) {
                            matchText.innerText = "";
                        } else if (password === confirm) {
                            matchText.innerText = "✔ Passwords match";
                            matchText.style.color = "green";
                        } else {
                            matchText.innerText = "✖ Passwords do not match";
                            matchText.style.color = "red";
                        }
                    }

                    // Final submit validation
                    function validatePassword() {
                        let pass = document.getElementById("password").value;
                        let confirm = document.getElementById("confirmPassword").value;

                        if (pass !== confirm) {
                            alert("Passwords do not match!");
                            return false;
                        }

                        if (pass.length < 6) {
                            alert("Password must be at least 6 characters!");
                            return false;
                        }

                        return true;
                    }
                </script>

            </div>
        </div>

    </div>
</div>

</body>
</html>
