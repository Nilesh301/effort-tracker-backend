<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Employee Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
             background-color: #ffffff;
             min-height: 100vh;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .card-header {
            font-size: 20px;
            font-weight: bold;
            background-color: #343a40;
            color: white;
            text-align: center;
            border-radius: 12px 12px 0 0;
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 20px;
        }

        .btn-sm {
            border-radius: 6px;
        }

        /* New style for export button */
        .btn-export {
            border-radius: 6px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

        <!-- LEFT -->
        <a class="navbar-brand" th:href="@{/efforts}">
            Employee Efforts Tracker
        </a>

        <!-- RIGHT -->
        <div class="d-flex align-items-center gap-3">
            <span class="text-white fw-bold">
                👤 [[${loggedInUser}]]
            </span>

            <a class="nav-link text-white" th:href="@{/logout}">
                Logout
            </a>
        </div>

    </div>
</nav>

<!-- ✅ Main Container -->
<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 85vh;">

    <div class="col-md-10">

        <div class="card">

            <!-- Header -->
            <div class="card-header">
                User Management
            </div>

            <!-- Body -->
            <div class="card-body">

                <!-- ✅ NEW: Export button for admin (only visible to ADMIN) -->
                <div sec:authorize="hasRole('ADMIN')" class="text-end mb-3">
                    <a th:href="@{/admin/export}" class="btn btn-primary btn-export">
                        Export Efforts
                    </a>
                </div>

                <!-- Table -->
                <table class="table table-striped table-bordered text-center align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>ID</th>
                        <th sec:authorize="hasRole('ADMIN')">Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.id}"></td>

                        <td sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/efforts/user/{id}(id=${user.id})}">
                                <button class="btn btn-success btn-sm">
                                    View Efforts
                                </button>
                            </a>
                        </td>
                    </tr>
                    </tbody>

                </table>

                <!-- No Data -->
                <div class="alert alert-danger text-center"
                     th:if="${users == null or users.isEmpty()}">
                    No users found.
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
