<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="text">
<head>
    <meta charset="UTF-8">
    <title>Effort Tracker</title>

    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
        background-color: #ffffff;
        min-height: 100vh;
            }

        .card {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .card-header {
            font-weight: bold;
            font-size: 18px;
            border-radius: 12px 12px 0 0;
        }

        .form-control, .form-select {
            border-radius: 8px;
        }

        .btn {
            border-radius: 8px;
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 22px;
        }
    </style>
</head>

<body>

<!-- ✅ Navbar (same as login/users page) -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid position-relative">

        <!-- Center Title -->
        <span class="navbar-brand mx-auto position-absolute start-50 translate-middle-x">
            Effort Tracker
        </span>

        <!-- Right Side -->
        <div class="ms-auto d-flex align-items-center gap-3">

            <!-- ✅ Username -->
            <span class="text-white fw-bold" th:text="'👤 ' + ${loggedInUser}"></span>

            <!-- Logout -->
            <a class="nav-link text-white" th:href="@{/logout}">Logout</a>

        </div>

    </div>
</nav>

<div class="container mt-4">

    <div id="successAlert" th:if="${param.success}" class="alert alert-success text-center">
        Effort added successfully!
    </div>

    <!-- ✅ Add Effort Form -->
    <div class="card mb-4 shadow">
        <div class="card-header bg-dark text-white text-center">

        </div>

        <div class="card-body">
            <div class="row">

                <form th:action="@{/efforts/add}" method="post">

                    <div class="row">

                        <div class="col mb-3">
                            <label>Category</label>
                            <select id="category" name="category"
                                    class="form-select"
                                    required onchange="enableFields()">
                                <option value="">-- Select --</option>
                                <option value="Adhoc Meetings">Adhoc Meetings</option>
                                <option value="Fixes">Fixes</option>
                                <option value="MIS">MIS</option>
                                <option value="Reports">Reports</option>
                            </select>
                        </div>

                        <div class="col mb-3">
                            <label>Task</label>
                            <input type="text" id="taskName" name="taskName"
                                   class="form-control" disabled required>
                        </div>

                        <div class="col mb-3">
                            <label>Description</label>
                            <input type="text" id="description" name="description"
                                   class="form-control" disabled>
                        </div>

                        <div class="col mb-3">
                            <label>Hours</label>
                            <!-- ✅ default value set to 0 -->
                            <input type="number" id="hours" name="hours"
                                   class="form-control"
                                   min="0" step="1" value="0"
                                   disabled required>
                        </div>

                        <div class="col mb-3">
                            <label>Minutes</label>
                            <input type="number" id="minutes" name="minutes"
                                   class="form-control"
                                   min="0" max="59" step="1"
                                   disabled required>
                        </div>


                        <div class="col mb-3">
                            <label>Date</label>
                            <input type="date" id="date" name="date"
                                   class="form-control" disabled
                                   th:attr="min=${#temporals.format(#temporals.createNow().minusDays(1), 'yyyy-MM-dd')},
                        max=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                                   required>
                        </div>

                    </div>

                    <div class="mt-2 text-center">
                        <button type="submit" class="btn btn-success w-25">
                            Add New Effort
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!--date filter button start-->

    <form method="get" th:action="@{/efforts/export}" class="row g-3 mb-3">

        <div class="col-md-3">
            <label class="form-label">From Date</label>
            <input type="date" name="fromDate" class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">To Date</label>
            <input type="date" name="toDate" class="form-control">
        </div>

        <div class="col-md-3 align-self-end">
            <button type="submit" class="btn btn-success w-100">
                Export Data
            </button>
        </div>

    </form>

    <!--end-->

    <!-- ✅ Efforts Table -->
    <div class="card shadow">
        <div class="card-header bg-dark text-white text-center fw-bold fs-5">
            Your Efforts
        </div>
        <div class="card-body">

            <table class="table table-bordered table-striped text-center"
                   th:if="${efforts != null and !efforts.isEmpty()}">

                <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Task</th>
                    <th>Description</th>
                    <th>Minutes</th>
                    <th>Hours</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="effort : ${efforts}" th:if="${effort != null}">
                    <td th:text="${effort.date}"></td>
                    <td th:text="${effort.category}"></td>
                    <td th:text="${effort.taskName}"></td>
                    <td th:text="${effort.description}"></td>
                    <td th:text="${effort.minutes}"></td>
                    <td th:text="${effort.hours}"></td>
                    <td>
                        <a th:href="@{/efforts/edit/{id}(id=${effort.id})}">
                            <button class="btn btn-warning btn-sm">Edit</button>
                        </a>
                        <a th:href="@{/efforts/delete/{id}(id=${effort.id})}"
                           onclick="return confirm('Are you sure?')">
                            <button class="btn btn-danger btn-sm">Delete</button>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-center mt-3">

                <!-- Previous -->
                <a th:if="${currentPage > 0}"
                   th:href="@{/efforts(page=${currentPage - 1}, size=${size}, fromDate=${fromDate}, toDate=${toDate})}"
                   class="btn btn-primary me-2">
                    Previous
                </a>

                <!-- Page Info -->
                <span class="align-self-center">
        Page [[${currentPage + 1}]] of [[${totalPages}]]
    </span>

                <!-- Next -->
                <a th:if="${currentPage < totalPages - 1}"
                   th:href="@{/efforts(page=${currentPage + 1})}"
                   class="btn btn-primary ms-2">
                    Next
                </a>

            </div>

            <!-- No Data -->
            <div class="alert alert-danger text-center"
                 th:if="${efforts == null or efforts.isEmpty()}">
                No efforts added yet.
            </div>

        </div>
    </div>

</div>

<script>
    function enableFields() {
        let category = document.getElementById("category").value;

        let disabled = (category === "");

        document.getElementById("taskName").disabled = disabled;
        document.getElementById("description").disabled = disabled;
         document.getElementById("minutes").disabled = disabled;
        document.getElementById("hours").disabled = disabled;
        document.getElementById("date").disabled = disabled;
    }
</script>
<script>
    setTimeout(function () {
        let alertBox = document.getElementById("successAlert");
        if (alertBox) {
            alertBox.style.transition = "opacity 0.1s ease";
            alertBox.style.opacity = "0";
            setTimeout(() => alertBox.remove(), 500);
        }
    }, 1000);
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        enableFields();
    });

    function enableFields() {
        let category = document.getElementById("category").value;

        let disabled = (category === "");

        let fields = [
            "taskName",
            "description",
            "minutes",
            "hours",
            "date"
        ];

        fields.forEach(id => {
            let el = document.getElementById(id);
            if (el) {
                el.disabled = disabled;

                if (disabled) {
                    el.value = "";
                }
            }
        });
    }
</script>
</body>
</html>
